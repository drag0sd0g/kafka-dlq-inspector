spring:
  application:
    name: kafka-dlq-inspector
  main:
    banner-mode: "off"
  kafka:
    bootstrap-servers:
      - localhost:9092
    properties:
      schema.registry.url: http://localhost:8081
    consumer:
      group-id: kafka-dlq-inspector
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  metrics:
    tags:
      application: kafka-dlq-inspector
kafka:
  dlq:
    topic-pattern: ".*\\.dlq"
    poll-size: 500
    poll-timeout-ms: 1000
    max-records: 1000
  export:
    max-records: 1000
  search:
    default-limit: 200
  aggregation:
    limit-per-topic: 500
  replay:
    max-messages: 1000
  alerting:
    threshold: 1000
  kafka-config:
    error-handler-backoff-ms: 5000
api:
  pagination:
    default-page-size: 50
cli:
  default-limit: 500
notifications:
  slack:
    webhook-url: ""
  webhook:
    url: ""
